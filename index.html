  <style>

    .wrap{width:min(100%,560px);padding-top:clamp(20px,3.7vh,44px);position:relative;z-index:1;animation:appIn .52s cubic-bezier(.2,.8,.2,1) both}
    .brand{display:flex;align-items:center;gap:14px;margin:0 8px 18px}.logo{color:var(--pumb);font-size:clamp(35px,9vw,48px);font-weight:900;line-height:.95;letter-spacing:-2.4px;text-shadow:0 10px 30px rgba(236,23,71,.18)}.divider{width:1px;height:36px;background:linear-gradient(180deg,transparent,var(--line),transparent)}.tag{font-size:14px;line-height:1.12;color:var(--muted);font-weight:760}
    .panel,.fx{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.025) 38%,rgba(236,23,71,.025)),var(--glass);-webkit-backdrop-filter:blur(30px) saturate(140%);backdrop-filter:blur(30px) saturate(140%);box-shadow:0 30px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.08)}
    .panel{padding:28px;border-radius:32px;isolation:isolate}.panel:before{content:"";position:absolute;inset:-1px;z-index:-2;background:radial-gradient(90% 48% at 0 0,rgba(255,255,255,.10),transparent 62%),radial-gradient(46% 42% at 100% 0,rgba(236,23,71,.22),transparent 70%)}.panel:after{content:"";position:absolute;width:260px;height:260px;right:-132px;top:-136px;border-radius:50%;z-index:-1;background:radial-gradient(circle at 32% 32%,#ff4168 0%,var(--pumb) 48%,var(--pumb2) 100%);box-shadow:0 0 72px rgba(236,23,71,.25)}
    .shine{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}.shine:after{content:"";position:absolute;width:66%;height:190%;top:-52%;left:-72%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.055),transparent);animation:shine 7s ease-in-out 1.2s infinite}
    .eyebrow{margin:0 0 9px;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.holder{margin:0 0 28px;max-width:90%;font-size:clamp(23px,5.8vw,32px);line-height:1.08;font-weight:850;letter-spacing:-.03em;text-wrap:balance}
    .number-box{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 12px 12px 18px;border:1px solid rgba(255,255,255,.105);border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.022)),rgba(8,10,14,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.055),0 12px 38px rgba(0,0,0,.18)}
    .number{flex:1;min-width:0;white-space:nowrap;overflow:hidden;font-family:"SFMono-Regular",Consolas,monospace;font-size:clamp(16px,5.4vw,28px);line-height:1;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums}.copy{width:58px;min-height:58px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border:1px solid rgba(255,255,255,.11);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 28%),linear-gradient(180deg,#ef244f,var(--pumb2));color:#fff;box-shadow:0 14px 32px rgba(236,23,71,.25),inset 0 1px 0 rgba(255,255,255,.14);cursor:pointer;transition:transform .18s ease,background .2s ease}.copy:active{transform:scale(.955)}.copy.done{background:linear-gradient(180deg,#3aca88,#239b66)}.copy svg{width:23px;height:23px;stroke:currentColor;stroke-width:2;fill:none}
    .status{min-height:22px;margin:14px 3px 0;color:var(--muted);font-size:13px;line-height:1.45;font-weight:650}.status.ok{color:#74ddb0}
    .fx{margin-top:16px;border-radius:26px;padding:18px 18px 16px;isolation:isolate}.fx:before{content:"";position:absolute;inset:-1px;z-index:-2;background:radial-gradient(80% 80% at 0 0,rgba(236,23,71,.14),transparent 62%),radial-gradient(60% 90% at 100% 100%,rgba(236,23,71,.08),transparent 72%)}.fx:after{content:"";position:absolute;top:-60%;left:-48%;width:36%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.075),transparent);animation:fxShine 4.7s ease-in-out infinite;pointer-events:none}
    .fx-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.fx-title{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.11em;text-transform:uppercase}.bars{display:inline-flex;align-items:flex-end;gap:2px;height:15px}.bars i{display:block;width:4px;border-radius:4px;background:var(--pumb);box-shadow:0 0 12px rgba(236,23,71,.25);animation:eq 1.15s ease-in-out infinite}.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:10px;animation-delay:.12s}.bars i:nth-child(3){height:15px;animation-delay:.24s}.live{display:flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(236,23,71,.18);border-radius:999px;background:rgba(236,23,71,.08);font-size:10px;font-weight:850;color:#ff6d8a;letter-spacing:.06em}.live-dot{width:7px;height:7px;border-radius:50%;background:var(--pumb);box-shadow:0 0 0 0 rgba(236,23,71,.5);animation:pulse 1.9s infinite}
    .fx-grid{display:grid;grid-template-columns:1fr 1px 1fr;align-items:stretch}.fx-sep{background:linear-gradient(180deg,transparent,var(--line),transparent)}.fx-card{padding:4px 10px;min-width:0}.fx-card:first-child{padding-left:2px}.fx-card:last-child{padding-right:2px}.fx-row{display:flex;align-items:center;gap:8px}.flag{font-size:23px;line-height:1}.code{font-size:14px;font-weight:850;color:#e9ebee}.equals{margin-top:8px;display:flex;align-items:baseline;gap:7px;white-space:nowrap}.unit{font-size:12px;color:var(--muted);font-weight:700}.rate{font-size:clamp(23px,6vw,31px);line-height:1;font-weight:900;letter-spacing:-.035em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#ff6282 86%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 20px rgba(236,23,71,.16))}.currency{font-size:16px;font-weight:850;color:#ff6b88}.rate.loading{opacity:.45;animation:breathe 1.1s ease-in-out infinite}.fx-note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:11px;border-top:1px solid rgba(255,255,255,.075);font-size:9.5px;color:var(--muted2)}.refresh{display:flex;align-items:center;gap:6px;white-space:nowrap}.spin{display:inline-block;font-size:15px;animation:slowSpin 6s linear infinite}.fine{margin:14px 8px 0;color:var(--muted2);font-size:11px;line-height:1.5;text-align:center}.toast{position:fixed;z-index:20;left:50%;bottom:max(26px,calc(var(--tg-content-safe-area-inset-bottom,0px) + 22px));transform:translate(-50%,18px) scale(.96);padding:12px 15px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(27,30,36,.8);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);color:#f6f7f8;font-size:13px;font-weight:750;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1)}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
    @keyframes appIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}@keyframes shine{0%,58%{transform:translateX(0) rotate(18deg);opacity:0}64%{opacity:1}82%,100%{transform:translateX(250%) rotate(18deg);opacity:0}}@keyframes fxShine{0%,55%{transform:translateX(0) rotate(18deg);opacity:0}62%{opacity:1}82%,100%{transform:translateX(430%) rotate(18deg);opacity:0}}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(236,23,71,0)}}@keyframes breathe{50%{opacity:.23}}@keyframes eq{0%,100%{transform:scaleY(.7);opacity:.65}50%{transform:scaleY(1);opacity:1}}@keyframes slowSpin{to{transform:rotate(360deg)}}@keyframes rateIn{0%{opacity:0;transform:translateY(8px) scale(.94);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
    .rate.updated{animation:rateIn .45s cubic-bezier(.2,.8,.2,1)}
    @media(max-width:430px){.wrap{padding-top:clamp(18px,3.2vh,32px)}.panel{padding:24px 20px;border-radius:28px}.holder{margin-bottom:24px}.number-box{gap:9px;padding:11px 11px 11px 15px}.copy{width:56px;min-height:56px;border-radius:17px}.fx{border-radius:22px;padding:16px 15px 14px}.fx-card{padding-inline:8px}.rate{font-size:clamp(21px,6.2vw,27px)}}
    @media(max-width:360px){.panel{padding:21px 16px}.number{font-size:15.2px}.copy{width:52px;min-height:52px}.fx{padding-inline:12px}.fx-card{padding-inline:5px}.rate{font-size:21px}.unit{font-size:11px}.currency{font-size:14px}}
    @media(prefers-reduced-motion:reduce){.wrap,.shine:after,.fx:after,.bars i,.live-dot,.spin,.rate.updated,.rate.loading{animation:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand"><div class="logo">ПУМБ</div><div class="divider"></div><div class="tag">Банк<br>для життя</div></header>
    <section class="panel" aria-labelledby="card-title">
      <div class="shine"></div>
      <p class="eyebrow">Одержувач</p>
      <h1 class="holder" id="card-title">Єрошов Іван Сергійович</h1>
      <p class="eyebrow">Номер картки</p>
      <div class="number-box">
        <div class="number" aria-label="Номер картки 4314 1402 1172 6887">4314 1402 1172 6887</div>
        <button class="copy" id="copy" type="button" aria-label="Скопіювати номер картки"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
      </div>
      <div class="status" id="status" aria-live="polite">Натисни кнопку — скопіюється номер без пробілів.</div>
    </section>
    <section class="fx" aria-label="Актуальний курс валют НБУ">
      <div class="fx-head">
        <div class="fx-title"><span class="bars"><i></i><i></i><i></i></span><span>Актуальний курс валют</span></div>
        <div class="live"><span class="live-dot"></span>LIVE</div>
      </div>
      <div class="fx-grid">
        <div class="fx-card">
          <div class="fx-row"><span class="flag">🇺🇸</span><span class="code">USD</span></div>
          <div class="equals"><span class="unit">1 $ =</span><span class="rate loading" id="usd">—</span><span class="currency">₴</span></div>
        </div>
        <div class="fx-sep"></div>
        <div class="fx-card">
          <div class="fx-row"><span class="flag">🇪🇺</span><span class="code">EUR</span></div>
          <div class="equals"><span class="unit">1 € =</span><span class="rate loading" id="eur">—</span><span class="currency">₴</span></div>
        </div>
      </div>
      <div class="fx-note"><span id="fxMeta">Курс НБУ · завантаження…</span><span class="refresh"><span class="spin">↻</span><span id="countdown">60с</span></span></div>
    </section>
    <div class="fine">Неофіційна сторінка для зручного копіювання реквізитів.</div>
  </main>
  <div class="toast" id="toast">Номер скопійовано ✓</div>
  <script>
    (()=>{
      const tg=window.Telegram?.WebApp;
      const raw='4314140211726887';
      const btn=document.getElementById('copy'),status=document.getElementById('status'),toast=document.getElementById('toast');
      const usdEl=document.getElementById('usd'),eurEl=document.getElementById('eur'),meta=document.getElementById('fxMeta'),countdown=document.getElementById('countdown');
      let resetTimer,toastTimer,seconds=60;
      function syncViewport(){const h=tg?.viewportStableHeight||tg?.viewportHeight||window.visualViewport?.height||window.innerHeight;if(h)document.documentElement.style.setProperty('--app-height',Math.round(h)+'px')}
      if(tg){try{tg.ready();tg.expand();tg.setHeaderColor?.('#0d0f13');tg.setBackgroundColor?.('#0d0f13');tg.disableVerticalSwipes?.();if(typeof tg.requestFullscreen==='function')tg.requestFullscreen();tg.onEvent?.('viewportChanged',syncViewport)}catch(e){console.warn(e)}}
      syncViewport();window.visualViewport?.addEventListener('resize',syncViewport);window.addEventListener('resize',syncViewport);
      async function writeClipboard(text){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy')}
      async function copyNumber(){clearTimeout(resetTimer);try{tg?.HapticFeedback?.impactOccurred?.('light');await writeClipboard(raw);btn.classList.add('done');status.classList.add('ok');status.textContent='Номер скопійовано ✓';toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500);tg?.HapticFeedback?.notificationOccurred?.('success');resetTimer=setTimeout(()=>{btn.classList.remove('done');status.classList.remove('ok');status.textContent='Натисни кнопку — скопіюється номер без пробілів.'},1800)}catch(e){status.textContent='Затисни номер і вибери «Копіювати».';tg?.HapticFeedback?.notificationOccurred?.('error')}}
      btn.addEventListener('click',copyNumber);
      function animateRate(el,target){const from=parseFloat(el.dataset.value||'0');const start=performance.now(),duration=700;el.classList.remove('loading','updated');void el.offsetWidth;el.classList.add('updated');function tick(now){const p=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-p,3),value=from+(target-from)*ease;el.textContent=value.toFixed(2);if(p<1)requestAnimationFrame(tick);else{el.dataset.value=target.toFixed(2);setTimeout(()=>el.classList.remove('updated'),500)}}requestAnimationFrame(tick)}
      async function loadRates(){try{const r=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json',{cache:'no-store'});if(!r.ok)throw new Error('http');const data=await r.json(),usd=data.find(x=>x.cc==='USD'),eur=data.find(x=>x.cc==='EUR');if(!usd||!eur)throw new Error('rate');animateRate(usdEl,Number(usd.rate));animateRate(eurEl,Number(eur.rate));const date=usd.exchangedate||eur.exchangedate||'';meta.textContent='Курс НБУ'+(date?' · '+date:'');seconds=60;countdown.textContent='60с'}catch(e){usdEl.classList.remove('loading');eurEl.classList.remove('loading');usdEl.textContent='—';eurEl.textContent='—';meta.textContent='Не вдалося оновити курс';countdown.textContent='↻'}}
      loadRates();
      setInterval(()=>{seconds--;if(seconds<=0){seconds=60;loadRates()}countdown.textContent=seconds+'с'},1000);
      setInterval(loadRates,15*60*1000);
    })();
  </script>
</body>
