igit 2.5s ease-in-out infinite}.digit.blue{color:#7ec2ff;text-shadow:0 0 6px #318cff}.footer{text-align:center;font-size:5px;letter-spacing:.24em;color:#626d80;flex:0 0 auto}@keyframes wave{0%,100%{transform:translateY(0) rotate(-2deg) scaleY(1)}50%{transform:translateY(-11px) rotate(2deg) scaleY(3)}}@keyframes orb{0%{left:0;opacity:0;transform:scale(.4)}12%{opacity:1}82%{opacity:1}100%{left:100%;opacity:0;transform:scale(1.8)}}@keyframes flowdigit{0%{left:0;opacity:0;transform:translateY(5px) scale(.55)}15%{opacity:1}55%{opacity:.95;transform:translateY(-7px) scale(1.15)}88%{opacity:.75}100%{left:98%;opacity:0;transform:translateY(3px) scale(.35)}}@keyframes portal{50%{transform:scale(1.2);filter:brightness(1.55)}}@keyframes digit{0%{transform:translateY(12px);opacity:0}22%{opacity:.9}55%{transform:translateY(-1px);opacity:.75}100%{transform:translateY(-14px);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:390px){.holder{font-size:20px}.number{font-size:17.5px}.paybadge{min-width:42px;padding:0 7px}.fx{grid-template-columns:1fr 1px 1fr 29px;gap:5px}.rate{gap:5px}.flag{width:22px;height:22px;font-size:13px}.rate-val{font-size:12.5px}.delta{font-size:6px}}@media(max-height:760px){.brand{height:33px}.logo{font-size:27px}.cardbox{padding:10px 11px}.holder{font-size:19px}.number-label{margin-top:9px}.number{font-size:17px}.number-box{padding-top:6px;padding-bottom:6px}.copy{width:40px;height:40px}.status{display:none}.transfer{padding:6px}.transfer-head{height:29px}.scene{min-height:130px}.phone{height:96px;width:59px;bottom:14px}.target{height:95px;width:82px;bottom:14px}.magic{left:66px;right:73px;top:29%}.portal{right:83px;bottom:44px}.fx{height:43px;flex-basis:43px}.cipher{height:23px;flex-basis:23px}.footer{display:none}}@media(max-height:680px){.brand{height:29px}.logo{font-size:25px}.cardbox{padding:8px 9px}.holder{font-size:18px}.number-label{margin-top:7px}.number-box{padding:5px 6px}.copy{width:37px;height:37px}.transfer-head{height:27 .appendChild(d)}setInterval(()=>{[...digits.children].forEach(d=>{if(Math.random()>.45)d.textContent=Math.floor(Math.random()*10)})},240);const usd=document.getElementById('usd'),eur=document.getElementById('eur'),ud=document.getElementById('usdDelta'),ed=document.getElementById('eurDelta'),refresh=document.getElementById('refresh');function ymd(d){return d.toISOString().slice(0,10).replaceAll('-','')}async function rate(code,date){const u='https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode='+code+(date?'&date='+date:'')+'&json';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('rate');const j=await r.json();return j?.[0]?.rate||null}async function previous(code){for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()-i);const v=await rate(code,ymd(d));if(v)return v}return null}function paint(el,cur,prev){if(!prev||!cur){el.className='delta flat';el.textContent='LIVE';return}const diff=cur-prev,pct=diff/prev*100;el.className='delta '+(diff>0?'up':diff<0?'down':'flat');el.innerHTML=(diff>0?'▲ +':diff<0?'▼ ':'• ')+diff.toFixed(2)+'<br>'+((pct>0?'+':'')+pct.toFixed(2)+'%')}async function loadRates(){refresh.classList.add('spin');try{const [u,e,up,ep]=await Promise.all([rate('USD'),rate('EUR'),previous('USD'),previous('EUR')]);usd.textContent=u?u.toFixed(2):'—';eur.textContent=e?e.toFixed(2):'—';paint(ud,u,up);paint(ed,e,ep)}catch(e){ud.className=ed.className='delta flat';ud.textContent=ed.textContent='NBU'}finally{setTimeout(()=>refresh.classList.remove('spin'),700)}}refresh.onclick=loadRates;loadRates();</script></body></html>
