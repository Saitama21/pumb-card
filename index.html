<html lang="uk">
<head>

<style>
:root{--pink:#ff2b63;--pink2:#ff6a9d;--blue:#4fb6ff;--violet:#7869ff;--green:#38e47e;--text:#f7fbff;--muted:#97a3b8;--vh:100dvh}
*{box-sizing:border-box}html,body{margin:0;background:#030713;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{height:var(--vh);overflow:hidden;padding:max(7px,env(safe-area-inset-top)) 9px max(7px,env(safe-area-inset-bottom));background:radial-gradient(60% 30% at 0 0,#ff24551b,transparent 72%),radial-gradient(55% 34% at 100% 10%,#1d73ff20,transparent 74%),radial-gradient(48% 35% at 0 80%,#642cff16,transparent 78%),radial-gradient(45% 32% at 100% 72%,#ff255518,transparent 76%),#030713}
.app{width:min(100%,520px);height:100%;margin:auto;display:flex;flex-direction:column;gap:7px}.glass{position:relative;overflow:hidden;border:1px solid #ffffff31;background:linear-gradient(145deg,#ffffff1a,#ffffff08 33%,#07101ee8 72%,#ff25550c);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:inset 0 1px #ffffff40,0 16px 38px #0009}.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(115deg,#ff527c99,#6fbcff80,#ffffff42,#ff356b80);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.brand{height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 6px}.brand-logo{font-size:34px;font-weight:950;line-height:1;letter-spacing:-2px;color:var(--pink);text-shadow:0 0 22px #ff25554d}.brand-line{width:1px;height:25px;background:linear-gradient(transparent,#ffffff70,transparent)}.brand-copy{font-size:10px;line-height:1.06;font-weight:800;color:#c4cbd6}.profile{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid #ffffff2f;background:radial-gradient(circle at 35% 25%,#ffffff2a,#10213a80 58%,#06101d 80%);box-shadow:inset 0 1px #ffffff38,0 0 18px #4ba4ff20}.profile svg{width:17px;fill:none;stroke:#aac8ff;stroke-width:1.6}
.card{flex:none;border-radius:29px;padding:15px 15px 13px;background:radial-gradient(80% 80% at 82% 10%,#0f2d5960,transparent 54%),linear-gradient(142deg,#ffffff20,#07111fe8 55%,#08131fe8 75%,#ff255513);box-shadow:inset 0 1px #ffffff49,0 18px 40px #000a,0 0 28px #2f8eff14}.card:after{content:"";position:absolute;inset:-18% -2% auto 25%;height:55%;border-radius:45% 45% 62% 38%/70% 40% 60% 35%;background:linear-gradient(180deg,#1e3a6d73,#07101c0a);filter:blur(.2px);transform:rotate(-4deg);box-shadow:inset 0 -1px #8dc9ff33}.card>*{position:relative;z-index:2}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eyebrow{font-size:8.5px;letter-spacing:.22em;font-weight:900;color:#bdc7d7;margin-bottom:8px}.name{font-size:22px;font-weight:850;letter-spacing:-.035em;white-space:nowrap;line-height:1.05}.schemes{display:flex;gap:6px}.scheme{height:29px;min-width:51px;border-radius:999px;border:1px solid #ffffff33;background:linear-gradient(145deg,#ffffff18,#07101d50);display:grid;place-items:center;box-shadow:inset 0 1px #ffffff2b,0 0 16px #5faeff10}.mc{width:27px;height:15px;position:relative}.mc:before,.mc:after{content:"";position:absolute;top:1px;width:14px;height:14px;border-radius:50%}.mc:before{left:1px;background:#ff3d4b}.mc:after{right:1px;background:#ffbd2f;mix-blend-mode:screen}.visa{font-size:11px;font-weight:950;font-style:italic}.number-label{margin-top:19px}.number{font-size:21px;font-weight:620;letter-spacing:.055em;white-space:nowrap;font-variant-numeric:tabular-nums;margin-bottom:12px}.card-bottom{display:flex;align-items:flex-end;gap:12px}.card-bottom .schemes{margin-right:auto}.copy-zone{position:absolute;right:14px;bottom:14px;width:130px;height:112px;pointer-events:none}.copy-orbit{position:absolute;right:7px;top:0;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#6aff9d25 0 34%,transparent 36%),conic-gradient(from 20deg,#35ff9440,#5bffa816,#26d76a55,#35ff9440);filter:drop-shadow(0 0 12px #32e47b6f);animation:orbit 6s linear infinite}.copy-orbit:before,.copy-orbit:after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfffd3,#35df79 45%,#0d8f43 78%);box-shadow:0 0 10px #37e87a}.copy-orbit:before{width:11px;height:11px;left:5px;top:26px}.copy-orbit:after{width:8px;height:8px;right:7px;bottom:15px}.copy-btn{pointer-events:auto;position:absolute;right:15px;top:10px;width:72px;height:72px;border-radius:50%;border:1px solid #a7ffc05e;background:radial-gradient(circle at 34% 26%,#a7ffc8,#3dde7c 35%,#129a45 70%,#075d2c);display:grid;place-items:center;color:white;box-shadow:inset 0 1px #ffffffa0,inset 0 -8px 18px #075f2d88,0 0 25px #39e87d8f,0 0 45px #18bd5c55;transition:.28s}.copy-btn svg{width:30px;fill:none;stroke:currentColor;stroke-width:2}.copy-btn .tick{position:absolute;font-size:34px;font-weight:950;opacity:0;transform:scale(.4);transition:.3s}.copy-btn.copied{animation:copyPulse .9s cubic-bezier(.16,1,.3,1)}.copy-btn.copied svg{opacity:0;transform:scale(.7)}.copy-btn.copied .tick{opacity:1;transform:scale(1)}.copy-text{position:absolute;right:0;bottom:0;font-size:7.6px;color:#81f4a8;text-shadow:0 0 8px #2ee374;white-space:nowrap}.copy-text:before{content:"✓";display:inline-grid;place-items:center;width:15px;height:15px;margin-right:5px;border-radius:50%;border:1px solid #58f49a;color:#62f4a2;box-shadow:0 0 8px #35e47e66}
.transfer{flex:1;min-height:0;border-radius:29px;padding:9px;display:flex;flex-direction:column;background:linear-gradient(145deg,#0b1730ed,#050b18f0 58%,#071526e7);border-color:#ff4d7964;box-shadow:inset 0 1px #ffffff2b,0 0 32px #ff25551c}.transfer-head{height:39px;flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.head-left{display:flex;align-items:center;gap:9px}.send{width:35px;height:35px;border-radius:12px;border:1px solid #ffffff2d;background:linear-gradient(145deg,#ffffff11,#06101d90);display:grid;place-items:center}.send svg{width:20px;fill:none;stroke:#ff5e86;stroke-width:1.8}.tt{font-size:10px;font-weight:950;letter-spacing:.14em}.live{padding:5px 10px;border-radius:999px;border:1px solid #ff567773;background:#ff2f5115;color:#ff7897;font-size:7px;font-weight:900;letter-spacing:.13em}.scene{position:relative;flex:1;min-height:145px;border-radius:23px;border:1px solid #ffffff1b;overflow:hidden;background:radial-gradient(55% 70% at 48% 52%,#a71e7623,transparent 68%),radial-gradient(36% 60% at 0 62%,#1f89ff24,transparent 72%),radial-gradient(36% 60% at 100% 55%,#ff25552e,transparent 72%),linear-gradient(180deg,#07101f,#040914);box-shadow:inset 0 1px #ffffff1c,0 0 26px #2069d51b}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 25% at 50% 83%,#ff2d6b22,transparent 72%),linear-gradient(180deg,transparent 70%,#0d1831 100%)}.floor{position:absolute;left:-12%;right:-12%;bottom:-8%;height:30%;background:radial-gradient(ellipse at center,#ff255528 0 12%,#1f5de313 38%,transparent 70%);filter:blur(7px)}.phone{position:absolute;left:21px;bottom:23px;width:76px;height:123px;border-radius:21px;border:1px solid #6ab2ff9a;background:linear-gradient(145deg,#1b2e4c,#050b15 72%);box-shadow:inset 0 1px #ffffff3c,0 18px 30px #0009,0 0 28px #2f8fff50;transform:perspective(520px) rotateY(10deg) rotateZ(-4deg)}.phone:before{content:"";position:absolute;left:8px;right:8px;top:8px;height:4px;border-radius:4px;background:#01040a}.phone:after{content:"PUMB";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:950;color:#ff4d79;text-shadow:0 0 14px #ff2b63}.mini-card{position:absolute;right:18px;bottom:34px;width:110px;height:86px;border-radius:15px;background:linear-gradient(145deg,#ff315f,#cf0b44 62%,#68071f);border:1px solid #ff8fac80;box-shadow:inset 0 1px #ffffff58,0 15px 26px #0008,0 0 28px #ff25556d;transform:perspective(520px) rotateY(-11deg) rotateZ(4deg)}.mini-card:before{content:"PUMB";position:absolute;left:10px;top:11px;font-size:12px;font-weight:950}.mini-card:after{content:"VISA";position:absolute;right:9px;bottom:8px;font-size:12px;font-style:italic;font-weight:950}.chip{position:absolute;left:11px;top:35px;width:19px;height:14px;border-radius:4px;background:linear-gradient(135deg,#f1d99d,#997138)}.contact{position:absolute;right:13px;top:34px;font-size:12px;color:#fff9}.portal{position:absolute;right:111px;bottom:47px;width:54px;height:54px;border-radius:50%;border:1px solid #ff5b9c;box-shadow:0 0 16px #ff2f79,inset 0 0 18px #ff2f79;animation:portal 1.6s ease-in-out infinite}.portal:before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid #ff4d933d}.portal:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff;filter:blur(4px);box-shadow:0 0 24px #ff296f}.stream{position:absolute;left:93px;right:126px;top:50%;height:118px;transform:translateY(-50%);filter:drop-shadow(0 0 8px #ff3d91)}.wave{position:absolute;left:-4%;width:108%;height:3px;border-radius:50%;background:linear-gradient(90deg,transparent,#3da7ff,#fff 43%,#ff4cc0 72%,#ff2455,transparent);box-shadow:0 0 10px #ff49a0,0 0 20px #3c8fff55;transform-origin:center;animation:wave 2.9s ease-in-out infinite}.w1{top:32px}.w2{top:54px;opacity:.75;animation-delay:-.95s}.w3{top:77px;opacity:.48;animation-delay:-1.9s}.bubble{position:absolute;width:10px;height:10px;border-radius:50%;border:1px solid #ff7eae88;background:radial-gradient(circle at 35% 25%,#ffffff9a,#ff5d9b25 36%,transparent 65%);box-shadow:0 0 9px #ff4387;animation:bubble 3.8s ease-in-out infinite}.b1{left:18%;top:12px}.b2{left:43%;top:86px;animation-delay:-1.1s}.b3{left:70%;top:20px;animation-delay:-2s}.b4{left:83%;top:68px;animation-delay:-2.7s}.flow-digit{position:absolute;font:850 11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#ff6e97;text-shadow:0 0 8px #ff255d;opacity:0;animation:flowDigit 3.1s linear infinite}.flow-digit.blue{color:#73c0ff;text-shadow:0 0 8px #3795ff}.fd1{top:11px;animation-delay:-.1s}.fd2{top:35px;animation-delay:-.7s}.fd3{top:59px;animation-delay:-1.25s}.fd4{top:85px;animation-delay:-1.85s}.fd5{top:45px;animation-delay:-2.4s}.fd6{top:72px;animation-delay:-2.8s}.number-stream{position:absolute;left:25%;right:24%;bottom:69px;text-align:center;font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;color:#ffb3c7;text-shadow:0 0 10px #ff386d;transform:rotate(2deg);opacity:.88}
.fx{height:52px;flex:none;margin-top:7px;border-radius:18px;border:1px solid #ffffff23;background:linear-gradient(115deg,#ffffff14,#06101de8 52%,#ff25550b);display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;padding:0 10px;box-shadow:inset 0 1px #ffffff2d,0 7px 18px #0005}.sep{width:1px;height:29px;background:linear-gradient(transparent,#8191aa66,transparent)}.rate{display:flex;align-items:center;gap:7px}.flag{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;border:1px solid #ffffff21;font-size:16px}.code{font-size:8px;font-weight:900;color:#cfd8e5;letter-spacing:.05em}.value{font-size:15px;font-weight:920;font-variant-numeric:tabular-nums}.delta{margin-left:auto;text-align:right;font-size:6.2px;font-weight:850;white-space:nowrap}.up{color:#2be4a3}.down{color:#ff4775}.flat{color:#9ba6b8}.security{height:33px;flex:none;border-radius:15px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(110deg,#ffffff0f,#081325cf 60%,#ff255507);box-shadow:inset 0 1px #ffffff20}.security-icon{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;border:1px solid #8fb6e82d;background:#ffffff08}.security-icon svg{width:13px;fill:none;stroke:#9db5d5;stroke-width:1.7}.security-text{font-size:7.7px;color:#8e9bb0;letter-spacing:.14em}.security-line{height:1px;flex:1;background:linear-gradient(90deg,#ffffff10,#6b8fbf55,transparent)}.footer{text-align:center;font-size:5px;letter-spacing:.25em;color:#5d6980;flex:none}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes copyPulse{0%{transform:scale(1)}35%{transform:scale(.86)}70%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes portal{50%{transform:scale(1.16);filter:brightness(1.5)}}@keyframes wave{0%,100%{transform:translateY(0) rotate(-2deg) scaleY(1)}50%{transform:translateY(-12px) rotate(2deg) scaleY(3.1)}}@keyframes bubble{0%,100%{transform:translateY(7px) scale(.75);opacity:.35}50%{transform:translateY(-8px) scale(1.2);opacity:1}}@keyframes flowDigit{0%{left:0;opacity:0;transform:translateY(7px) scale(.5)}15%{opacity:1}55%{transform:translateY(-8px) scale(1.2);opacity:1}100%{left:98%;opacity:0;transform:translateY(3px) scale(.25)}}
@media(max-width:390px){.name{font-size:20px}.number{font-size:18px}.copy-zone{transform:scale(.9);transform-origin:right bottom}.fx{padding:0 8px}.flag{width:24px;height:24px;font-size:14px}.value{font-size:13px}.delta{font-size:5.8px}}
@media(max-height:760px){.brand{height:36px}.brand-logo{font-size:29px}.card{padding:12px}.name{font-size:19px}.number-label{margin-top:13px}.number{font-size:18px;margin-bottom:8px}.copy-zone{transform:scale(.84);transform-origin:right bottom}.transfer-head{height:34px}.scene{min-height:130px}.phone{height:108px;width:68px;bottom:17px}.mini-card{width:98px;height:78px;bottom:25px}.portal{right:101px;bottom:39px}.fx{height:45px}.security{height:28px}.footer{display:none}}
@media(max-height:680px){.brand{height:32px}.card{padding:10px}.name{font-size:18px}.number{font-size:16.5px}.transfer-head{height:31px}.scene{min-height:116px}.fx{height:41px}.security{height:25px}}
</style>
</head>
<body>
<main class="app">
  <header class="brand">
    <div class="brand-logo">PUMB</div><div class="brand-line"></div><div class="brand-copy">Банк<br>для життя</div>
    <div class="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.3-4.2 4-6.3 8-6.3s6.7 2.1 8 6.3"/></svg></div>
  </header>

  <section class="card glass">
    <div class="card-head">
      <div><div class="eyebrow">ОДЕРЖУВАЧ</div><div class="name">Єрошов Іван Сергійович</div></div>
      <div class="schemes"><div class="scheme"><i class="mc"></i></div><div class="scheme visa">VISA</div></div>
    </div>
    <div class="eyebrow number-label">НОМЕР КАРТКИ</div>
    <div class="number">4314 1402 1172 6887</div>
    <div class="card-bottom"><div class="schemes"><div class="scheme"><i class="mc"></i></div><div class="scheme visa">VISA</div></div></div>
    <div class="copy-zone">
      <div class="copy-orbit"></div>
      <button class="copy-btn" id="copy" aria-label="Копіювати номер картки"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="10" height="10" rx="2"/><path d="M15 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></svg><span class="tick">✓</span></button>
      <div class="copy-text" id="copyText">Номер скопійовано</div>
    </div>
  </section>

  <section class="transfer glass">
    <div class="transfer-head"><div class="head-left"><div class="send"><svg viewBox="0 0 24 24"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10l18-7Z"/></svg></div><div class="tt">ПЕРЕКАЗ КОШТІВ</div></div><div class="live">● LIVE</div></div>
    <div class="scene">
      <div class="floor"></div>
      <div class="phone"></div>
      <div class="stream"><i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i><i class="bubble b1"></i><i class="bubble b2"></i><i class="bubble b3"></i><i class="bubble b4"></i><span class="flow-digit fd1">4</span><span class="flow-digit blue fd2">3</span><span class="flow-digit fd3">1</span><span class="flow-digit blue fd4">4</span><span class="flow-digit fd5">7</span><span class="flow-digit blue fd6">2</span></div>
      <div class="number-stream">4314 1402 1172 6887</div>
      <div class="portal"></div>
      <div class="mini-card"><i class="chip"></i><i class="contact">)))</i></div>
    </div>
    <div class="fx">
      <div class="rate"><div class="flag">🇺🇸</div><div><div class="code">USD</div><div class="value" id="usd">—</div></div><div class="delta flat" id="usdDelta">LIVE</div></div>
      <div class="sep"></div>
      <div class="rate"><div class="flag">🇪🇺</div><div><div class="code">EUR</div><div class="value" id="eur">—</div></div><div class="delta flat" id="eurDelta">LIVE</div></div>
    </div>
  </section>

  <section class="security glass"><div class="security-line"></div><div class="security-icon"><svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-5"/></svg></div><div class="security-text">ВАШІ КОШТИ ПІД ЗАХИСТОМ</div><div class="security-line"></div></section>
  <div class="footer">НАДІЙНІСТЬ · РОЗВИТОК · ДЛЯ ТЕБЕ</div>
</main>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#030713');tg?.setBackgroundColor?.('#030713')}catch(e){}
function syncVh(){document.documentElement.style.setProperty('--vh',(tg?.viewportStableHeight||tg?.viewportHeight||innerHeight)+'px')}syncVh();addEventListener('resize',syncVh);tg?.onEvent?.('viewportChanged',syncVh);
const copy=document.getElementById('copy'),copyText=document.getElementById('copyText');
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('4314140211726887')}catch(e){const ta=document.createElement('textarea');ta.value='4314140211726887';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.classList.remove('copied');void copy.offsetWidth;copy.classList.add('copied');copyText.textContent='Номер скопійовано';tg?.HapticFeedback?.notificationOccurred?.('success');setTimeout(()=>copy.classList.remove('copied'),1500)});
const fmt=n=>Number(n).toFixed(2);const dateStr=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
async function rate(code,date){const r=await fetch(`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=${code}&date=${dateStr(date)}&json`,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();return j?.[0]?.rate||null}
async function latest(code){for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()-i);const v=await rate(code,d);if(v)return {v,d}}throw 0}
async function previous(code,from){for(let i=1;i<8;i++){const d=new Date(from);d.setDate(d.getDate()-i);const v=await rate(code,d);if(v)return v}return null}
function paint(id,val,prev){document.getElementById(id).textContent=fmt(val);const el=document.getElementById(id+'Delta');if(!prev){el.textContent='LIVE';el.className='delta flat';return}const diff=val-prev,p=diff/prev*100;el.textContent=`${diff>0?'▲':'▼'} ${Math.abs(diff).toFixed(2)} · ${Math.abs(p).toFixed(2)}%`;el.className='delta '+(diff>0?'up':diff<0?'down':'flat')}
async function load(){try{const [u,e]=await Promise.all([latest('USD'),latest('EUR')]);const [up,ep]=await Promise.all([previous('USD',u.d),previous('EUR',e.d)]);paint('usd',u.v,up);paint('eur',e.v,ep)}catch(e){document.getElementById('usd').textContent='44.56';document.getElementById('eur').textContent='51.79';document.getElementById('usdDelta').textContent='offline';document.getElementById('eurDelta').textContent='offline'}}load();setInterval(load,15*60*1000);
</script>
</body>
</html>
