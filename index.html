@keyframes livePulse{0%,100%{transform:scale(.84);opacity:.7}50%{transform:scale(1.08);opacity:1}}@keyframes phoneFloat{0%,100%{transform:perspective(560px) rotateY(13deg) rotateZ(-6deg) translate3d(0,0,0)}50%{transform:perspective(560px) rotateY(11deg) rotateZ(-5deg) translate3d(1px,-3px,0)}}@keyframes cardFloat{0%,100%{transform:perspective(620px) rotateY(-12deg) rotateZ(5deg) translate3d(0,0,0)}50%{transform:perspective(620px) rotateY(-10deg) rotateZ(4deg) translate3d(-2px,-3px,0)}}@keyframes planePulse{0%,100%{transform:translate3d(0,0,0);opacity:.8}50%{transform:translate3d(3px,-2px,0) scale(1.05);opacity:1}}@keyframes dash{to{stroke-dashoffset:-180}}@keyframes dashReverse{to{stroke-dashoffset:180}}@keyframes sparkFallback{0%{transform:translate3d(-14px,10px,0) scale(.68);opacity:0}14%,74%{opacity:.95}100%{transform:translate3d(30px,-16px,0) scale(1.03);opacity:0}}@keyframes sparkTravel{0%{offset-distance:0%;opacity:0;transform:scale(.62)}12%{opacity:.95}50%{transform:scale(1.08)}88%{opacity:.85}100%{offset-distance:100%;opacity:0;transform:scale(.7)}}@keyframes syncSpin{0%{transform:rotate(0) scale(.9)}70%{transform:rotate(330deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
@media(max-width:410px){body{padding-left:7px;padding-right:7px}.app{gap:7px}.topbar{height:62px;flex-basis:62px;padding-left:12px;padding-right:12px}.brand-logo{font-size:37px;letter-spacing:-2.5px}.brand-copy{font-size:13px}.card{height:218px;flex-basis:218px;border-radius:27px;padding:20px 20px 16px}.name{font-size:21px;max-width:calc(100% - 82px)}.number-label{margin-top:22px}.number{font-size:23px}.copy-cluster{right:2px;top:35px;width:78px;height:90px}.liquid-copy{width:50px;height:50px}.copy-feedback{width:74px;font-size:6.2px}.schemes{bottom:7px}.scheme{height:32px}.scheme.mc{width:51px}.scheme.visa{width:57px;font-size:14px}.transfer{border-radius:26px;padding:11px}.transfer-head{height:36px;margin-bottom:7px}.send{width:34px;height:34px}.send svg{width:22px}.transfer-title{font-size:16px}.live{height:28px;font-size:10px}.scene{height:166px;border-radius:18px}.phone-model{left:17px;bottom:23px;width:60px;height:108px}.mini-card{right:16px;bottom:43px;width:95px;height:66px}.flow-svg{left:61px;right:69px;width:calc(100% - 130px);height:96px}.spark{font-size:13px}.rates{height:52px;border-radius:17px;padding:0 9px;grid-template-columns:1fr 32px 1fr}.flag{width:29px;height:29px;font-size:18px}.rate{gap:6px}.rate-code{font-size:11px}.rate-value{font-size:18px}.security{height:33px;flex-basis:33px}.security-text{font-size:9.5px}.disclaimer{font-size:7.5px}}
@media(max-height:730px){.topbar{height:56px;flex-basis:56px}.card{height:205px;flex-basis:205px;padding-top:18px}.name{font-size:20px}.number-label{margin-top:18px}.number{font-size:22px}.copy-cluster{top:31px}.transfer{padding:10px}.scene{height:154px}.phone-model{height:99px;width:57px;bottom:20px}.mini-card{height:62px;width:90px;bottom:39px}.rates{height:48px;margin-top:7px}.security,.disclaimer{display:none}}

</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<main class="app">
  <header class="topbar"><div class="brand-logo">PUMB</div><i class="brand-line" aria-hidden="true"></i><div class="brand-copy">особиста<br>сторінка</div></header>
  <section class="card glass" aria-label="Картка отримувача">
    <div class="liquid-wave" aria-hidden="true"></div><div class="mountains" aria-hidden="true"><i class="ridge one"></i><i class="ridge two"></i></div>
    <div class="card-inner">
      <div class="schemes" aria-hidden="true"><span class="scheme mc"></span><span class="scheme visa">VISA</span></div>
      <div class="card-copy"><div class="label">Одержувач</div><div class="name">Єрошов Іван Сергійович</div><div class="label number-label">Номер картки</div><div class="number">4314 1402 1172 6887</div><div class="hint">Натисни кнопку — номер скопіюється без пробілів.</div></div>
      <div class="copy-cluster" id="copyCluster">
        <button class="liquid-copy" id="copyBtn" type="button" aria-label="Скопіювати номер картки"><span class="liquid-copy__ring" aria-hidden="true"></span><i class="liquid-copy__bubble lb1" aria-hidden="true"></i><i class="liquid-copy__bubble lb2" aria-hidden="true"></i><i class="liquid-copy__bubble lb3" aria-hidden="true"></i><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span class="liquid-copy__check" aria-hidden="true"></span></button>
        <div class="copy-feedback" id="copyFeedback" aria-live="polite"><span class="copy-feedback__dot" aria-hidden="true"></span>Номер скопійовано</div>
      </div>
    </div>
  </section>
  <section class="transfer glass" aria-label="Переказ коштів">
    <div class="transfer-head"><div class="head-left"><div class="send" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10l18-7Z"/></svg></div><div class="transfer-title">ПЕРЕКАЗ КОШТІВ</div></div><div class="live"><i></i>LIVE</div></div>
    <div class="scene">
      <div class="phone-model"></div><svg class="phone-plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10l18-7Z" fill="none" stroke="#52c6ff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="flow-svg" viewBox="0 0 360 140" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="flowA" x1="0" x2="1"><stop offset="0" stop-color="#51baff"/><stop offset=".38" stop-color="#ffffff"/><stop offset=".67" stop-color="#ff55bc"/><stop offset="1" stop-color="#ff2e66"/></linearGradient><linearGradient id="flowB" x1="0" x2="1"><stop offset="0" stop-color="#836fff"/><stop offset=".45" stop-color="#36baff"/><stop offset="1" stop-color="#ff2d70"/></linearGradient><linearGradient id="flowC" x1="0" x2="1"><stop offset="0" stop-color="#ff92c2"/><stop offset=".5" stop-color="#80c7ff"/><stop offset="1" stop-color="#ff2d66"/></linearGradient></defs><path class="flow flow-a" d="M0 80 C64 8 119 132 187 73 S291 19 360 73"/><path class="flow flow-b" d="M0 61 C63 120 121 8 191 61 S292 119 360 63"/><path class="flow flow-c" d="M0 88 C79 36 121 105 196 82 S290 38 360 83"/></svg>
      <div class="spark-field" aria-hidden="true"><span class="spark blue s1">7</span><span class="spark s2">3</span><span class="spark blue s3">0</span><span class="spark s4">5</span><span class="spark s5">9</span><span class="spark blue s6">8</span><span class="spark s7">2</span><span class="spark s8">8</span></div>
      <div class="mini-card"><i class="chip"></i><i class="contact">)))</i></div>
    </div>
    <div class="rates"><div class="rate"><span class="flag">🇺🇸</span><span class="rate-text"><b class="rate-code">USD</b><span class="rate-value" id="usdVal">—</span></span></div><button class="refresh" type="button" id="refreshRates" aria-label="Оновити курс; курс також оновлюється автоматично"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.4-4.8L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.4 4.8L20 16"/><path d="M20 20v-4h-4"/></svg></button><div class="rate"><span class="flag">🇪🇺</span><span class="rate-text"><b class="rate-code">EUR</b><span class="rate-value" id="eurVal">—</span></span></div></div>
  </section>
  <section class="security glass"><span class="security-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-5"/></svg></span><span class="security-text">Ваші кошти під надійним захистом</span></section>
  <div class="disclaimer">особиста сторінка переказу, не офіційний застосунок банку</div>
</main>
<script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#030611');tg?.setBackgroundColor?.('#030611')}catch(e){}
function syncVh(){document.documentElement.style.setProperty('--vh',(tg?.viewportStableHeight||tg?.viewportHeight||innerHeight)+'px')}syncVh();addEventListener('resize',syncVh);tg?.onEvent?.('viewportChanged',syncVh);
const raw='4314140211726887',copyBtn=document.getElementById('copyBtn'),copyCluster=document.getElementById('copyCluster');let copyTimer;
async function copyCard(){try{await navigator.clipboard.writeText(raw)}catch(e){const ta=document.createElement('textarea');ta.value=raw;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}clearTimeout(copyTimer);copyCluster.classList.remove('is-copied');void copyBtn.offsetWidth;copyCluster.classList.add('is-copied');try{tg?.HapticFeedback?.notificationOccurred?.('success')}catch(e){}copyTimer=setTimeout(()=>copyCluster.classList.remove('is-copied'),2100)}copyBtn.addEventListener('click',copyCard);
const fmtDate=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
async function getRate(code,date){const u=`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=${code}&date=${fmtDate(date)}&json`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();return j?.[0]?.rate||null}
async function latestRate(code){for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()-i);const v=await getRate(code,d).catch(()=>null);if(v)return v}return null}
function setRate(code,value){document.getElementById(code.toLowerCase()+'Val').textContent=value?value.toFixed(2)+' ₴':'—'}
const refreshBtn=document.getElementById('refreshRates');let ratesLoading=false,lastRatesUpdate=0;
async function loadRates(){if(ratesLoading)return;ratesLoading=true;refreshBtn.classList.add('is-syncing');try{const [usd,eur]=await Promise.all([latestRate('USD'),latestRate('EUR')]);setRate('USD',usd);setRate('EUR',eur);lastRatesUpdate=Date.now()}finally{setTimeout(()=>refreshBtn.classList.remove('is-syncing'),480);ratesLoading=false}}
refreshBtn.addEventListener('click',()=>{loadRates();try{tg?.HapticFeedback?.impactOccurred?.('light')}catch(e){}});loadRates();setInterval(loadRates,15*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRatesUpdate>60*1000)loadRates()});window.addEventListener('online',loadRates);
</script>
</body>
