<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="format-detection" content="telephone=no" />
  <title>PUMB Card</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#050816;
      --panel:#091323;
      --text:#f8f9fc;
      --muted:#b5bfd2;
      --pink:#ff275f;
      --pink2:#ef1555;
      --green:#40f28f;
      --blue:#8bbcff;
      --line:rgba(203,215,241,.24);
      --radius:34px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050816;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif}
    body{
      min-height:100dvh;
      overflow-x:hidden;
      background:
        radial-gradient(48rem 24rem at 4% 3%,rgba(206,29,82,.17),transparent 64%),
        radial-gradient(42rem 28rem at 100% 92%,rgba(180,18,68,.14),transparent 70%),
        linear-gradient(180deg,#050816 0%,#070916 100%);
      padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
    }
    button{font:inherit}
    .app{width:min(1160px,100%);margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:2px 12px 22px}
    .identity{display:flex;align-items:center;gap:24px;min-width:0}
    .logo{font-size:clamp(42px,7vw,74px);line-height:.92;font-weight:950;letter-spacing:-.07em;color:var(--pink);text-shadow:0 0 28px rgba(255,39,95,.16)}
    .divider{width:1px;height:67px;background:linear-gradient(transparent,rgba(255,255,255,.38),transparent)}
    .slogan{font-size:clamp(18px,2.2vw,29px);font-weight:850;line-height:1.03;color:#c9cfdb}
    .profile{width:74px;height:74px;flex:0 0 74px;border-radius:50%;border:1px solid rgba(139,188,255,.38);background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.06),rgba(11,23,43,.5) 62%,rgba(5,10,19,.8));display:grid;place-items:center;color:var(--blue);box-shadow:inset 0 0 0 4px rgba(139,188,255,.07),0 14px 30px rgba(0,0,0,.22)}
    .profile svg{width:38px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

    .card{
      position:relative;overflow:hidden;border-radius:var(--radius);min-height:510px;padding:1px;
      background:linear-gradient(112deg,rgba(121,187,255,.66),rgba(255,255,255,.24) 38%,rgba(255,75,139,.72));
      box-shadow:0 30px 90px rgba(0,0,0,.38),0 0 42px rgba(255,40,95,.06);
    }
    .card::before{content:"";position:absolute;inset:1px;border-radius:calc(var(--radius) - 1px);background:
      radial-gradient(42rem 18rem at 22% 10%,rgba(33,89,168,.17),transparent 62%),
      radial-gradient(35rem 24rem at 86% 93%,rgba(255,28,92,.11),transparent 68%),
      linear-gradient(136deg,rgba(12,23,44,.985),rgba(5,10,22,.99) 68%,rgba(9,10,20,.985));}
    .accent{position:absolute;z-index:1;top:1px;right:1px;width:31%;height:83%;border-radius:0 calc(var(--radius) - 1px) 0 0;background:linear-gradient(160deg,#ff356b 0%,#ff1459 53%,rgba(118,5,45,.8) 100%);clip-path:polygon(28% 0,100% 0,100% 100%,76% 93%,56% 82%,42% 69%,31% 54%,23% 38%,18% 22%);opacity:.97}
    .accent::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.1),transparent 28%,rgba(45,0,19,.14))}
    .glass-sweep{position:absolute;z-index:1;left:-6%;right:21%;top:10%;height:150px;border-radius:50%;transform:rotate(-7deg);background:linear-gradient(120deg,transparent,rgba(83,139,255,.08),rgba(255,57,114,.05),transparent);filter:blur(1px)}
    .content{position:relative;z-index:2;min-height:510px;padding:clamp(28px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto;gap:14px 26px}
    .eyebrow,.number-label{font-size:clamp(14px,1.6vw,20px);letter-spacing:.32em;font-weight:900;color:#bec7d8}
    .name-row{display:flex;align-items:center;gap:16px;margin-top:10px;min-width:0}
    .name{margin:0;font-size:clamp(34px,4.5vw,58px);line-height:1.02;letter-spacing:-.045em;font-weight:900;text-wrap:balance}
    .verified{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#52f5a1,#21d77d);color:#032919;font-size:30px;font-weight:1000;box-shadow:0 0 26px rgba(64,242,143,.36),inset 0 -4px 12px rgba(0,0,0,.13)}
    .schemes{display:flex;align-items:center;gap:12px;position:relative;z-index:4}
    .scheme{height:68px;border:1px solid rgba(255,255,255,.21);border-radius:26px;background:rgba(78,43,72,.34);box-shadow:inset 0 0 0 2px rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center}
    .mastercard{width:128px}
    .mc{position:relative;width:74px;height:42px}
    .mc::before,.mc::after{content:"";position:absolute;top:2px;width:40px;height:40px;border-radius:50%}
    .mc::before{left:4px;background:#ff344f}
    .mc::after{right:4px;background:#ffb73b;mix-blend-mode:screen}
    .visa{width:138px;font-size:27px;font-style:italic;font-weight:950;letter-spacing:.03em}
    .number-label{grid-column:1/-1;margin-top:8px}
    .number-box{grid-column:1/-1;position:relative;min-height:205px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008));box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);display:flex;align-items:center;padding:26px 230px 26px 38px}
    .number{font-size:clamp(36px,5.2vw,68px);font-weight:900;letter-spacing:.055em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px rgba(255,255,255,.12)}
    .demo-note{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#8792a8;font-size:11px;letter-spacing:.11em;text-transform:uppercase}
    .demo-note strong{color:#f3a4bc;font-weight:900}

    /* Copy button: intentionally kept as the approved green orbital style */
    .copy-orb{position:absolute;right:27px;bottom:18px;width:182px;height:182px;border:0;background:transparent;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .copy-orb:focus-visible{outline:3px solid rgba(139,188,255,.9);outline-offset:4px;border-radius:50%}
    .ring{position:absolute;border-radius:50%;pointer-events:none}
    .ring.outer{inset:5px;border:2px solid rgba(64,242,143,.28);box-shadow:0 0 22px rgba(64,242,143,.12)}
    .ring.inner{inset:28px;border:2px solid rgba(64,242,143,.39);box-shadow:0 0 18px rgba(64,242,143,.10)}
    .core{position:absolute;inset:39px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 29%,#6affb5 0%,#3df199 37%,#20ca79 76%,#159e5d 100%);box-shadow:0 0 25px rgba(64,242,143,.72),0 0 62px rgba(64,242,143,.3),inset 0 0 0 2px rgba(255,255,255,.17),inset 0 -12px 28px rgba(0,70,37,.16);transition:transform .2s cubic-bezier(.2,.85,.3,1.3),filter .2s ease}
    .core svg{width:48px;fill:none;stroke:white;stroke-width:3.1;stroke-linejoin:round}
    .copy-orb:hover .core{transform:scale(1.04);filter:brightness(1.04)}
    .copy-orb:active .core{transform:scale(.96)}
    .particle{position:absolute;border-radius:50%;background:#4bf598;box-shadow:0 0 14px rgba(75,245,152,.9);pointer-events:none}
    .p1{width:13px;height:13px;left:1px;top:82px}.p2{width:9px;height:9px;left:43px;top:27px}.p3{width:10px;height:10px;right:1px;top:23px}.p4{width:20px;height:20px;right:4px;bottom:17px}
    .copy-orb.copied .core{transform:scale(1.08);filter:brightness(1.08)}
    .copy-orb.copied .ring.outer{animation:pulse .6s ease-out}
    @keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.16);opacity:0}}

    .toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:11px 15px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(14,21,35,.94);box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:13px;color:#fff;transition:.2s ease;z-index:20}
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media(max-width:820px){
      body{padding-inline:10px}
      .topbar{padding-inline:5px}.identity{gap:13px}.divider{height:48px}.profile{width:58px;height:58px;flex-basis:58px}.profile svg{width:29px}
      .card,.content{min-height:560px}.content{grid-template-columns:1fr;padding:24px 18px 19px}.schemes{position:absolute;top:24px;right:18px;transform:scale(.78);transform-origin:top right}.recipient{padding-top:88px}.verified{width:43px;height:43px;font-size:24px}.accent{width:48%;height:63%}.number-box{min-height:260px;padding:26px 135px 24px 20px;align-items:flex-end}.number{font-size:clamp(31px,8vw,44px);white-space:normal;line-height:1.25}.copy-orb{width:145px;height:145px;right:3px;bottom:7px}.core{inset:31px}.core svg{width:39px}.demo-note{align-items:flex-start;flex-direction:column;gap:5px}
    }
    @media(max-width:500px){
      .slogan,.divider{display:none}.logo{font-size:45px}.profile{width:52px;height:52px;flex-basis:52px}.card,.content{min-height:535px}.content{padding-top:20px}.recipient{padding-top:72px}.name{font-size:34px}.eyebrow,.number-label{letter-spacing:.24em}.schemes{right:6px;top:17px;transform:scale(.66)}.accent{width:52%;height:59%}.number-box{min-height:235px;padding-right:108px;padding-left:16px}.number{font-size:32px;letter-spacing:.04em}.copy-orb{width:122px;height:122px;right:-2px;bottom:5px}.core{inset:25px}.core svg{width:33px}.p1{width:9px;height:9px;top:57px}.p2{width:7px;height:7px;left:31px;top:17px}.p3{width:7px;height:7px}.p4{width:14px;height:14px}.ring.inner{inset:20px}.demo-note{font-size:9px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="identity">
        <div class="logo">ПУМБ</div>
        <div class="divider" aria-hidden="true"></div>
        <div class="slogan">Банк<br>для життя</div>
      </div>
      <div class="profile" aria-label="Профіль">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="16" r="7"></circle><path d="M12 38c1.7-7.6 6-11.4 12-11.4S34.3 30.4 36 38"></path></svg>
      </div>
    </header>

    <section class="card" aria-label="Демонстраційний блок картки">
      <div class="accent" aria-hidden="true"></div>
      <div class="glass-sweep" aria-hidden="true"></div>
      <div class="content">
        <div class="recipient">
          <div class="eyebrow">ОДЕРЖУВАЧ</div>
          <div class="name-row">
            <h1 class="name">Yeroshov Ivan Sergiyovich</h1>
            <span class="verified" aria-label="Перевірено">✓</span>
          </div>
        </div>

        <div class="schemes" aria-label="Платіжні системи">
          <div class="scheme mastercard"><div class="mc" aria-label="Mastercard"></div></div>
          <div class="scheme visa">VISA</div>
        </div>

        <div class="number-label">НОМЕР КАРТКИ</div>
        <div class="number-box">
          <div class="number" id="cardNumber">•••• •••• •••• 6887</div>
          <button class="copy-orb" id="copyButton" type="button" aria-label="Скопіювати демонстраційний номер">
            <span class="ring outer"></span><span class="ring inner"></span>
            <span class="particle p1"></span><span class="particle p2"></span><span class="particle p3"></span><span class="particle p4"></span>
            <span class="core">
              <svg viewBox="0 0 44 44" aria-hidden="true"><rect x="9" y="9" width="21" height="21" rx="4"></rect><rect x="15" y="15" width="21" height="21" rx="4"></rect></svg>
            </span>
          </button>
        </div>

        <div class="demo-note"><strong>DEMO UI</strong><span>Не є платіжним інструментом</span></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Демо-номер скопійовано</div>

  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        try { tg.ready(); tg.expand(); tg.setHeaderColor?.('#050816'); tg.setBackgroundColor?.('#050816'); } catch (_) {}
      }

      const demoNumber = '•••• •••• •••• 6887';
      const button = document.getElementById('copyButton');
      const toast = document.getElementById('toast');
      let timer;

      async function copyDemo() {
        try {
          await navigator.clipboard.writeText(demoNumber);
        } catch (_) {
          const ta = document.createElement('textarea');
          ta.value = demoNumber;
          ta.setAttribute('readonly','');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        button.classList.add('copied');
        toast.classList.add('show');
        clearTimeout(timer);
        timer = setTimeout(() => { button.classList.remove('copied'); toast.classList.remove('show'); }, 1300);
        try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (_) {}
      }

      button.addEventListener('click', copyDemo);
    })();
  </script>
</body>
</html>
