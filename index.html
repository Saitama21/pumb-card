async function copyCard(){try{await navigator.clipboard.writeText(raw)}catch(e){const ta=document.createElement('textarea');ta.value=raw;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}clearTimeout(copyTimer);copyBtn.classList.remove('copied');copyState.classList.remove('show');void copyBtn.offsetWidth;copyBtn.classList.add('copied');copyState.classList.add('show');try{tg?.HapticFeedback?.notificationOccurred?.('success')}catch(e){}copyTimer=setTimeout(()=>{copyBtn.classList.remove('copied');copyState.classList.remove('show')},1700)}copyBtn.addEventListener('click',copyCard);
const fmtDate=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
async function getRate(code,date){const u=`https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode=${code}&date=${fmtDate(date)}&json`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();return j?.[0]?.rate||null}
async function latestPair(code){let cur=null,curDate=null;for(let i=0;i<8;i++){const d=new Date();d.setDate(d.getDate()-i);const v=await getRate(code,d).catch(()=>null);if(v){cur=v;curDate=d;break}}if(!cur)return null;let prev=null;for(let i=1;i<8;i++){const d=new Date(curDate);d.setDate(d.getDate()-i);const v=await getRate(code,d).catch(()=>null);if(v){prev=v;break}}return{cur,prev}}
function setRate(code,data){const val=document.getElementById(code.toLowerCase()+'Val'),delta=document.getElementById(code.toLowerCase()+'Delta');if(!data){val.textContent='—';delta.textContent='N/A';delta.className='delta flat';return}val.textContent=data.cur.toFixed(2)+' ₴';if(!data.prev){delta.textContent='LIVE';delta.className='delta flat';return}const diff=data.cur-data.prev,pct=diff/data.prev*100;delta.textContent=(diff>0?'▲ ':'▼ ')+Math.abs(diff).toFixed(2)+' · '+Math.abs(pct).toFixed(2)+'%';delta.className='delta '+(diff>0?'up':diff<0?'down':'flat')}
let ratesLoading=false,lastRatesUpdate=0;async function loadRates(){if(ratesLoading)return;ratesLoading=true;try{const [u,e]=await Promise.all([latestPair('USD'),latestPair('EUR')]);setRate('USD',u);setRate('EUR',e);lastRatesUpdate=Date.now()}finally{ratesLoading=false}}
loadRates();setInterval(loadRates,15*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastRatesUpdate>60*1000)loadRates()});window.addEventListener('online',loadRates);
</script>
