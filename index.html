h:0}.flag{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#ffffff0e;border:1px solid #ffffff22;font-size:15px}.code{font-size:8px;font-weight:900;color:#dce3ee}.value{font-size:14px;font-weight:950;font-variant-numeric:tabular-nums}.delta{margin-left:auto;text-align:right;font-size:6.5px;font-weight:850;white-space:nowrap}.up{color:#2be4a3}.down{color:#ff4775}.flat{color:#9ba6b8}.refresh{width:29px;height:29px;border-radius:10px;border:1px solid #ffffff1f;background:#ffffff0b;color:#a8c8ff;display:grid;place-items:center;font-size:16px}.refresh.spin{animation:spin .65s linear}.cipher{height:27px;flex:none;border-radius:13px;display:flex;align-items:center;padding:0 7px;gap:6px;background:linear-gradient(110deg,#ffffff12,#ff245508,#0c1930c0);box-shadow:inset 0 1px #ffffff25,0 6px 16px #0005}.shield{width:21px;height:21px;flex:none;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,#ff3769,#8c123e);box-shadow:0 0 12px #ff245545}.shield svg{width:12px;fill:none;stroke:#fff;stroke-width:1.7}.digits{height:17px;flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}.digit{position:absolute;font:750 8.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#ff6c91;text-shadow:0 0 6px #ff285e;animation:digit 2.5s ease-in-out infinite}.digit.blue{color:#7ec2ff;text-shadow:0 0 6px #318cff}.footer{text-align:center;font-size:5px;letter-spacing:.24em;color:#647083;flex:none}@keyframes strand{0%,100%{transform:translateY(0) rotate(-2deg) scaleY(1)}50%{transform:translateY(-13px) rotate(2deg) scaleY(3.2)}}@keyframes particle{0%{left:0;opacity:0;transform:scale(.4)}12%{opacity:1}84%{opacity:1}100%{left:100%;opacity:0;transform:scale(1.8)}}@keyframes flow{0%{left:0;opacity:0;transform:translateY(7px) scale(.5)}15%{opacity:1}55%{transform:translateY(-8px) scale(1.2);opacity: </head><body><main class="app"><header class="brand"><strong>ПУМБ</strong><i></i><span>Банк<br>для життя</span></header><section class="details glass"><div class="top"><div><div class="label">ОДЕРЖУВАЧ</div><div class="name">Єрошов Іван Сергійович <span class="check">✓</span></div></div><div class="badges"><span class="badge"><i class="mc"></i></span><span class="badge">VISA</span></div></div><div class="label cardlabel">НОМЕР КАРТКИ</div><div class="numberrow"><div class="number">4314 1402 1172 6887</div><button class="copy" id="copy" aria-label="Копіювати"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div></section><section class="transfer glass"><div class="thead"><div class="thleft"><div class="plane"><svg viewBox="0 0 24 24"><path d="M21 3 9.5 14.5M21 3l-7 18-4.5-6.5L3 10l18-7Z"/></svg></div><div><div class="tt">ПЕРЕКАЗ КОШТІВ</div><div class="ts">Швидко. Безпечно. 24/7</div></div></div><div class="live">● LIVE</div></div><div class="scene"><div class="phone"></div><div class="energy"><i class="strand s1"></i><i class="strand s2"></i><i class="strand s3"></i><i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i><b class="flow f1">7</b><b class="flow blue f2">3</b><b class="flow f3">8</b><b class="flow blue f4">2</b><b class="flow f5">5</b></div><div class="portal"></div><div class="target"><b>ПУМБ</b><i class="chip"></i><span class="contact">)))</span><em>VISA</em></div></div><div class="fx"><div class="rate"><span class="flag">🇺🇸</span><div><div class="code">USD</div><div class="value" id="usd">—</div></div><div class="delta flat" id="usdD">LIVE</div></div><i class="sep"></i><div class="rate"><span class="flag">🇪🇺</span><div><div class="code">EUR</div><div class="value" id="eur">—</div></div><div class="delta flat" id="eurD">LIVE</div></div><button class="refresh" id="refresh" aria-label="Оновити">↻</button></div></section><section class="cipher glass"><div class="shield"><svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-5"/></svg></div><div class="digits" id="digits"></div></section><footer class="footer">НАДІЙНІСТЬ · РОЗВИТОК · ДЛЯ ТЕБЕ</footer></main><script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();tg?.disableVerticalSwipes?.();tg?.setHeaderColor?.('#040814');tg?.setBackgroundColor?.('#040814')}catch(e){}function vh(){document.documentElement.style.setProperty('--vh',(tg?.viewportStableHeight||tg?.viewportHeight||innerHeight)+'px')}vh();addEventListener('resize',vh);tg?.onEvent?.('viewportChanged',vh);
const copy=document.getElementById('copy');copy.onclick=async()=>{try{await navigator.clipboard.writeText('4314140211726887');copy.classList.add('ok');tg?.HapticFeedback?.notificationOccurred?.('success');setTimeout(()=>copy.classList.remove('ok'),1200)}catch(e){}};
const digits=document.getElementById('digits');for(let i=0;i<20;i++){let d=document.createElement('i');d.className='digit'+(i%4===0?' blue':'');d.textContent=Math.floor(Math.random()*10);d.style.left=(2+Math.random()*95)+'%';d.style.top=(Math.random()*12-1)+'px';d.style.animationDelay=(-Math.random()*2.5)+'s';d.style.animationDuration=(1.5+Math.random()*2)+'s';digits.appendChild(d)}setInterval(()=>[...digits.children].forEach(d=>{if(Math.random()>.45)d.textContent=Math.floor(Math.random()*10)}),240);
const pad=n=>String(n).padStart(2,'0');const ymd=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());async function rate(code,date){let r=await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode='+code+'&date='+ymd(date)+'&json',{cache:'no-store'});if(!r.ok)throw Error();let j=await r.json();return j[0]?.rate||null}async function pair(code){let found=[];for(let i=0;i<10&&found.length<2;i++){let d=new Date();d.setDate(d.getDate()-i);let v=await rate(code,d);if(v)found.push(v)}return found}function show(id,idD,a){let el=document.getElementById(id),de=document.getElementById(idD);el.textContent=a[0].toFixed(2);if(a[1]){let x=a[0]-a[1],p=x/a[1]*100;de.className='delta '+(x>0?'up':x<0?'down':'flat');de.innerHTML=(x>0?'▲ +':x<0?'▼ ':'')+x.toFixed(2)+'<br>'+p.toFixed(2)+'%'}}async function load(){let b=document.getElementById('refresh');b.classList.add('spin');try{let [u,e]=await Promise.all([pair('USD'),pair('EUR')]);show('usd','usdD',u);show('eur','eurD',e)}catch(e){document.getElementById('usdD').textContent='НБУ';document.getElementById('eurD').textContent='НБУ'}finally{setTimeout(()=>b.classList.remove('spin'),650)}}document.getElementById('refresh').onclick=load;load();
