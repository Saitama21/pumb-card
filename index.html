<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Button Motion Lab</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="app">
  <header class="hero">
    <div>
      <div class="eyebrow">PUMB-CARD / BUTTON LAB</div>
      <h1>Кнопки.<br>От простого до вау.</h1>
    </div>
    <div class="fps" id="fps">-- FPS</div>
  </header>

  <p class="intro">Только кнопки — каждая показывает отдельный уровень графики и анимации. Нажимай, держи, води пальцем.</p>

  <section class="stack">

    <button class="demo-btn basic" data-demo="basic">
      <span class="num">01</span>
      <span class="copy"><b>Обычная</b><small>HTML + CSS</small></span>
      <span class="arrow">→</span>
    </button>

    <button class="demo-btn press" data-demo="press">
      <span class="num">02</span>
      <span class="copy"><b>Живая кнопка</b><small>scale · spring · shadow</small></span>
      <span class="pulse-dot"></span>
    </button>

    <button class="demo-btn glow" data-demo="glow">
      <span class="num">03</span>
      <span class="copy"><b>Свет и стекло</b><small>glow · blur · liquid highlight</small></span>
      <span class="glass-orb"></span>
    </button>

    <button class="demo-btn svg-btn" data-demo="svg">
      <svg class="svg-line" viewBox="0 0 520 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M8 50 C95 4 170 96 260 50 S425 4 512 50"/>
      </svg>
      <span class="num">04</span>
      <span class="copy"><b>Векторная</b><small>SVG stroke animation</small></span>
      <span class="vector-chip">SVG</span>
    </button>

    <button class="demo-btn canvas-btn" data-demo="canvas">
      <canvas id="particleCanvas"></canvas>
      <span class="num">05</span>
      <span class="copy"><b>Частицы</b><small>Canvas 2D · realtime</small></span>
      <span class="particle-badge">2D</span>
    </button>

    <button class="demo-btn webgl-btn" id="webglButton" data-demo="webgl">
      <canvas id="webglCanvas"></canvas>
      <span class="num">06</span>
      <span class="copy"><b>Жидкий GPU</b><small>WebGL shader</small></span>
      <span class="gpu-badge">GPU</span>
    </button>

    <button class="demo-btn tilt-btn" id="tiltButton" data-demo="tilt">
      <span class="tilt-slab slab-a"></span>
      <span class="tilt-slab slab-b"></span>
      <span class="num">07</span>
      <span class="copy"><b>3D-параллакс</b><small>perspective · touch tilt</small></span>
      <span class="cube">◆</span>
    </button>

    <button class="demo-btn raster-btn" id="rasterButton" data-demo="raster">
      <span class="raster-bg"></span>
      <span class="mini-card card-a">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=420&q=82" alt="">
        <i>TECH</i>
      </span>
      <span class="mini-card card-b">
        <img src="https://images.unsplash.com/photo-1488590528505-98d2b5aba04b?auto=format&fit=crop&w=420&q=82" alt="">
        <i>WEBP</i>
      </span>
      <span class="mini-card card-c">
        <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=420&q=82" alt="">
        <i>PHOTO</i>
      </span>
      <span class="num">08</span>
      <span class="copy raster-copy"><b>Растровые карточки</b><small>photo / WebP-style layers inside button</small></span>
      <span class="top-badge">MAX</span>
    </button>

  </section>

  <section class="hint">
    <span>Тап</span>
    <span>Удержание</span>
    <span>Проведи пальцем</span>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
