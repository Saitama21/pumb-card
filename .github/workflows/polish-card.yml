name: Polish card UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'format-detection' not in s:
              s = s.replace('<meta name="theme-color" content="#090c11">', '<meta name="theme-color" content="#090c11"><meta name="format-detection" content="telephone=no">')

          s = s.replace('.number{flex:1;white-space:nowrap;', '.number{flex:1;white-space:nowrap;color:#fff;text-decoration:none;')

          if '.number a{' not in s:
              s = s.replace('.copy{width:58px;', '.number a{color:inherit!important;text-decoration:none!important;pointer-events:none}.copy{width:58px;')

          badge_css = '''.holder-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.holder-head .eyebrow{margin:0}.paybadges{display:flex;align-items:center;gap:8px}.paybadge{height:28px;min-width:48px;padding:0 9px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffffff10,#ffffff04);border:1px solid #ffffff16;box-shadow:inset 0 1px #ffffff16;animation:badgeFloat 3.6s ease-in-out infinite}.paybadge.mc{box-shadow:0 0 16px #ff294d55,inset 0 1px #ffffff18}.paybadge.visa{font-weight:950;font-style:italic;letter-spacing:-.04em;color:#fff;box-shadow:0 0 16px #26a7ff55,inset 0 1px #ffffff18}.mcmark{position:relative;width:31px;height:17px}.mcmark:before,.mcmark:after{content:\"\";position:absolute;top:0;width:17px;height:17px;border-radius:50%}.mcmark:before{left:1px;background:#ff233d}.mcmark:after{right:1px;background:#ff9b21;mix-blend-mode:screen}.paybadge:nth-child(2){animation-delay:.45s}@keyframes badgeFloat{0%,100%{transform:translateY(0);filter:brightness(1)}50%{transform:translateY(-2px);filter:brightness(1.12)}}'''
          if '.holder-head{' not in s:
              s = s.replace('.holder{margin:0 0 27px;', badge_css + '.holder{margin:0 0 27px;')

          old = '<p class="eyebrow">Одержувач</p><h1 class="holder">'
          new = '<div class="holder-head"><p class="eyebrow">Одержувач</p><div class="paybadges" aria-label="Платіжні системи"><span class="paybadge mc"><span class="mcmark"></span></span><span class="paybadge visa">VISA</span></div></div><h1 class="holder">'
          if old in s and 'paybadges' not in s.split('<body>',1)[1]:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore white card number and add animated payment badges"
          git push
