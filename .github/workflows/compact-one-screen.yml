name: Compact one-screen mobile layout
on:
  push:
    paths:
      - '.github/workflows/compact-one-screen.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact page to one iPhone screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* COMPACT_ONE_SCREEN_V1 */'
          if marker not in s:
              css=r'''/* COMPACT_ONE_SCREEN_V1 */
@media (max-width:600px) and (max-height:950px){
  body{padding:max(6px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));overflow:hidden}
  .wrap{max-width:520px}
  .brand{height:38px;margin:0 6px 6px;gap:10px}.logo{font-size:31px}.divider{height:25px}.tag{font-size:10px}
  .cardbox{padding:12px 12px 10px;border-radius:24px}.cardbox:after{width:210px;height:210px;right:-112px;top:-116px}
  .eyebrow{font-size:8px;margin-bottom:4px}.holder{font-size:20px;margin-bottom:10px}.paybadge{height:23px;min-width:42px;padding:0 8px}.visa{font-size:10px}.mcmark{transform:scale(.82)}
  .number-box{padding:6px 6px 6px 10px;border-radius:16px}.number{font-size:16px;letter-spacing:.025em}.copy{width:42px;height:42px;border-radius:14px}.copy svg{width:18px}.status{margin:6px 2px 0;font-size:9px;line-height:1.1}
  .transfer{margin-top:7px;padding:9px 9px 8px;border-radius:24px}.transfer-head{margin-bottom:6px}.head-left{gap:7px}.send-icon{width:31px;height:31px;border-radius:10px}.send-icon svg{width:17px}.t-title{font-size:9px}.t-sub{font-size:7.5px}.live{font-size:7px;padding:4px 7px}
  .scene{height:220px;border-radius:18px}.phone{left:2px;bottom:62px;width:66px;height:126px;border-radius:17px}.phone:after{font-size:28px}.target-card{right:-3px;bottom:57px;width:100px;height:128px;border-radius:15px}.target-card:before{left:10px;top:14px;font-size:14px}.target-card:after{right:9px;bottom:10px;font-size:14px}.chip{left:10px;top:42px;width:22px;height:16px}.contactless{left:38px;top:41px;font-size:13px}.beam{left:58px;right:72px;bottom:112px}.ring{right:78px;bottom:98px;width:28px;height:28px}
  .bill,.coin{left:64px;top:80px}.bill{width:58px;height:30px;border-radius:5px}.bill:before{left:5px;top:5px;width:16px;height:19px}.bill:after{right:5px;bottom:4px;font-size:11px}.coin{width:17px;height:17px}.coin:after{font-size:8px}
  .progress{left:13px;right:13px;bottom:8px}.bar{margin:0 4px 10px}.steps{font-size:7px;gap:4px}
  .security{margin-top:7px;padding:8px 10px!important;border-radius:20px!important;min-height:52px!important}.security-icon{width:38px!important;height:38px!important;border-radius:13px!important}.security h3{font-size:13px!important}.security p{font-size:8px!important}
  .features{margin-top:6px!important;gap:4px!important}.feature{font-size:7px!important}.feature-icon{width:31px!important;height:31px!important;font-size:14px!important;margin-bottom:3px!important}
  .footerline{margin-top:5px!important;font-size:6.5px!important;letter-spacing:.25em!important}.fine{display:none!important}
}
@media (max-width:600px) and (max-height:760px){
  .brand{height:32px}.logo{font-size:27px}.cardbox{padding:10px}.holder{font-size:18px}.status{display:none}
  .scene{height:190px}.phone{bottom:54px;height:110px;width:60px}.target-card{bottom:50px;height:112px;width:90px}.progress{bottom:6px}
  .security{min-height:46px!important}.features{margin-top:4px!important}.feature-icon{width:27px!important;height:27px!important}
}
'''
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit compact layout
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fit premium transfer UI into one mobile screen"
          git push
