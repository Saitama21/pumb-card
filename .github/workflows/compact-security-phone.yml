name: Compact security and preserve phone
on:
  push:
    paths:
      - '.github/workflows/compact-security-phone.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* COMPACT_SECURITY_PHONE_V2 */'
          css=r'''/* COMPACT_SECURITY_PHONE_V2 */
.security{padding:5px 8px!important;min-height:44px!important;border-radius:16px!important;gap:7px!important;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.028) 38%,rgba(7,12,22,.76) 80%,rgba(255,36,85,.055))!important;box-shadow:inset 0 1px rgba(255,255,255,.17),0 10px 26px rgba(0,0,0,.30)!important}
.security-icon{width:30px!important;height:30px!important;border-radius:10px!important;font-size:14px!important;box-shadow:inset 0 1px rgba(255,255,255,.24),0 0 14px #ff245533!important}
.security h3{font-size:10.5px!important;line-height:1.05!important;letter-spacing:-.01em!important}.security p{font-size:6.8px!important;margin-top:1px!important}.chev{font-size:18px!important}
.scene{overflow:hidden!important}.phone{left:8px!important;bottom:48px!important;width:61px!important;height:116px!important;transform:perspective(420px) rotateY(8deg) rotateZ(-5deg)!important;box-shadow:inset 0 1px #ffffff25,0 12px 25px #0008,0 0 20px #3d8dff2b!important}
@media(max-height:760px){.security{padding:4px 7px!important;min-height:39px!important;border-radius:14px!important}.security-icon{width:27px!important;height:27px!important;border-radius:9px!important}.security h3{font-size:9.5px!important}.security p{font-size:6.2px!important}.phone{left:7px!important;bottom:44px!important}}
'''
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compact liquid glass security block and preserve phone contour"
          git push
