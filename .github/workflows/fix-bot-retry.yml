name: Fix bot retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bot-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch polling startup
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot/index2.mjs')
          s = p.read_text(encoding='utf-8')
          old = '''async function pollingLoop() {
  await bot('deleteWebhook', { drop_pending_updates: false });
  const me = await bot('getMe');
  console.log(`Bot started: @${me.username}`);
  console.log(`Public origin: ${PUBLIC_ORIGIN ?? '[none]'}`);
  console.log(`Inline image URL: ${CARD_IMAGE_URL ?? '[cached-photo fallback]'}`);

  while (true) {
    try {
      const updates = await bot('getUpdates', {
        offset,
        timeout: 50,
        allowed_updates: ['message', 'inline_query'],
      });
      for (const update of updates) {
        offset = update.update_id + 1;
        try {
          await handleUpdate(update);
        } catch (error) {
          console.error(`Update ${update.update_id} failed:`, error);
        }
      }
    } catch (error) {
      console.error('Polling failed:', error);
      await new Promise((resolve) => setTimeout(resolve, 2000));
    }
  }
}
'''
          new = '''const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function telegramCallWithRetry(method, params = {}, options = {}) {
  const retries = options.retries ?? 8;
  const baseDelay = options.baseDelay ?? 2000;
  let lastError;
  for (let attempt = 1; attempt <= retries; attempt += 1) {
    try {
      return await bot(method, params);
    } catch (error) {
      lastError = error;
      const delay = Math.min(baseDelay * attempt, 15000);
      console.error(`${method} failed (${attempt}/${retries}):`, error.message);
      if (attempt < retries) await sleep(delay);
    }
  }
  throw lastError;
}

async function pollingLoop() {
  for (;;) {
    try {
      await telegramCallWithRetry('deleteWebhook', { drop_pending_updates: false }, { retries: 6, baseDelay: 2500 });
      const me = await telegramCallWithRetry('getMe', {}, { retries: 6, baseDelay: 2500 });
      console.log(`Bot started: @${me.username}`);
      console.log(`Public origin: ${PUBLIC_ORIGIN ?? '[none]'}`);
      console.log(`Inline image URL: ${CARD_IMAGE_URL ?? '[cached-photo fallback]'}`);
      break;
    } catch (error) {
      console.error('Telegram startup failed; retrying in 15s:', error.message);
      await sleep(15000);
    }
  }

  while (true) {
    try {
      const updates = await bot('getUpdates', {
        offset,
        timeout: 50,
        allowed_updates: ['message', 'inline_query'],
      });
      for (const update of updates) {
        offset = update.update_id + 1;
        try {
          await handleUpdate(update);
        } catch (error) {
          console.error(`Update ${update.update_id} failed:`, error);
        }
      }
    } catch (error) {
      console.error('Polling failed:', error.message || error);
      await sleep(3000);
    }
  }
}
'''
          if old not in s:
              raise SystemExit('Expected pollingLoop block not found')
          s = s.replace(old, new, 1)
          old_tail = '''pollingLoop().catch((error) => {
  console.error('Fatal bot error:', error);
  process.exit(1);
});'''
          new_tail = '''pollingLoop().catch(async (error) => {
  console.error('Unexpected polling loop failure:', error);
  while (true) {
    await sleep(15000);
    try {
      await pollingLoop();
      break;
    } catch (retryError) {
      console.error('Polling restart failed:', retryError);
    }
  }
});'''
          if old_tail not in s:
              raise SystemExit('Expected fatal tail not found')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/index2.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Make Telegram polling resilient to startup failures"
          git push
