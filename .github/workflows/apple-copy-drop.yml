name: Apple liquid copy success

on:
  push:
    paths:
      - '.github/workflows/apple-copy-drop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch copy success animation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* COPY_SUCCESS_LIQUID_V2 */'
          if marker not in s:
              css = r'''/* COPY_SUCCESS_LIQUID_V2 */
.copy{position:relative;overflow:hidden;isolation:isolate;transition:background .28s ease,border-color .28s ease,box-shadow .28s ease,transform .22s cubic-bezier(.2,.9,.25,1)}
.copy::after{content:"";position:absolute;z-index:-1;left:50%;top:50%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#d9ffe5 0 8%,#66e88f 25%,#30d158 55%,#159447 100%);transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none}
.copy.copy-success{background:linear-gradient(145deg,#43dc72,#1eaa52)!important;border-color:rgba(205,255,220,.55)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.48),0 10px 28px rgba(48,209,88,.36),0 0 22px rgba(48,209,88,.26)!important;animation:copySquish .62s cubic-bezier(.2,.9,.25,1)}
.copy.copy-success::after{animation:liquidBloom .68s cubic-bezier(.16,.82,.24,1) forwards}
.copy.copy-success svg{animation:copyGlyph .56s cubic-bezier(.2,1.35,.3,1)}
@keyframes liquidBloom{0%{opacity:.95;transform:translate(-50%,-50%) scale(.12);border-radius:50%}35%{opacity:1;transform:translate(-50%,-50%) scale(2.1,1.25);border-radius:38% 62% 55% 45%/58% 42% 58% 42%}70%{opacity:.95;transform:translate(-50%,-50%) scale(4.4,3.8);border-radius:48% 52% 46% 54%/52% 47% 53% 48%}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}
@keyframes copySquish{0%{transform:scale(1)}26%{transform:scale(.88,.94)}58%{transform:scale(1.06,.98)}100%{transform:scale(1)}}
@keyframes copyGlyph{0%{transform:scale(1)}32%{transform:scale(.72) rotate(-5deg)}68%{transform:scale(1.14) rotate(2deg)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.copy.copy-success,.copy.copy-success::after,.copy.copy-success svg{animation:none!important}}
'''
              s = s.replace('</style>', css + '</style>', 1)

          needle = "status.style.color='#72ddb0';"
          replacement = "status.style.color='#30d158';btn.classList.remove('copy-success');void btn.offsetWidth;btn.classList.add('copy-success');setTimeout(()=>btn.classList.remove('copy-success'),1350);"
          if needle in s:
              s = s.replace(needle, replacement, 1)
          elif "btn.classList.add('copy-success')" not in s:
              raise SystemExit('copy success handler not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix green liquid copy success animation"
          git push
